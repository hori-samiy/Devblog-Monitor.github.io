<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мониторинг серверов</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0f0f0f;--card1:#282828;--card2:#161616;--tx:#ddd;--hi:#fff;--mu:#8a8a8a;--bd:#ffffff17;--ac:#555;--ok:#4ade80;--mid:#fbbf24;--bad:#f87171;--blue:#738dff;--on:#0f0f0f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f4f4;--card1:#fff;--card2:#f0f0f0;--tx:#333;--hi:#111;--mu:#666;--bd:#00000018;--ac:#bbb;--on:#fff;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.w{max-width:1100px;margin:0 auto;padding:28px 18px 56px}
.head{text-align:center;margin:36px 0 30px}
h1{color:var(--hi);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;letter-spacing:3px;text-transform:uppercase;line-height:1.1}
.acc{display:inline-block;position:relative;z-index:0}
.acc:before{content:"";position:absolute;z-index:-1;left:-12px;right:-2px;top:10%;bottom:10%;background:#32323280;border-left:4px solid var(--ac);border-radius:2px;transform:skewX(-10deg);box-shadow:0 2px 8px #3232324d}
.sub{color:var(--mu);margin-top:14px;font-size:.95rem;letter-spacing:.5px}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hi);margin-right:8px;vertical-align:middle;animation:pl 2.4s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #ffffff80}70%,to{box-shadow:0 0 0 10px #fff0}}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.st{flex:1;min-width:150px;background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--bd);border-radius:18px;padding:16px 20px}
.st b{display:block;color:var(--hi);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.st span{color:var(--mu);font-size:.8rem}
.fl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
.pill{background:#ffffff0a;border:1px solid var(--bd);border-radius:999px;color:var(--mu);cursor:pointer;font:inherit;font-size:.86rem;font-weight:600;padding:9px 20px;transition:background .2s,color .2s}
.pill:hover{color:var(--hi)}
.pill:focus-visible,.btn:focus-visible,.ip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pill.on{background:var(--hi);border-color:var(--hi);color:var(--on)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.card{position:relative;background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--bd);border-radius:22px;padding:22px 22px 18px;box-shadow:0 22px 46px #00000050;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s}
.card:hover{transform:translateY(-4px);border-color:#ffffff40}
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dot{flex:0 0 52px;height:52px;border-radius:16px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 18%,var(--card2));box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.dot img{width:100%;height:100%;object-fit:cover;display:block}
.dot b{color:var(--c);font-size:1.35rem;font-weight:800;text-transform:uppercase;text-shadow:0 0 14px var(--c)}
.bgs{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dev{border:1px solid color-mix(in srgb,var(--blue) 55%,transparent);background:color-mix(in srgb,var(--blue) 14%,transparent);border-radius:999px;color:var(--blue);font-size:.72rem;font-weight:700;letter-spacing:.8px;padding:3px 11px;white-space:nowrap;text-transform:uppercase}
.nm{color:var(--hi);font-size:1.12rem;font-weight:700;line-height:1.2;flex:1;min-width:0}
.rep{border:1px solid var(--bd);border-radius:999px;color:var(--mid);font-size:.78rem;font-weight:700;padding:3px 11px;white-space:nowrap}
.vers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ver{border:1px solid var(--bd);border-radius:999px;color:var(--mu);font-size:.72rem;font-weight:600;padding:2px 10px}
.bar{display:flex;height:10px;border-radius:10px;background:#ffffff17;box-shadow:inset 0 1px 2px #00000080;overflow:hidden;margin-bottom:12px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#86efac);box-shadow:0 0 12px #4ade8073;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.full span{background:linear-gradient(90deg,#dc2626,#f87171)}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px}
.foot b{color:var(--hi);font-size:1.15rem;font-variant-numeric:tabular-nums}
.foot small{color:var(--mu);font-size:.82rem}
.err{color:var(--bad)}
.act{display:flex;gap:8px;align-items:center}
.ip{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f0f0f73;border:1px solid #ffffff38;border-radius:50px;color:#fff;cursor:pointer;font:inherit;font-size:.82rem;font-weight:600;height:42px;padding:0 18px;min-width:0;transition:background .3s,color .3s,transform .2s}
.ip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ip:hover{background:#ffffff1a}
.ip:active{transform:scale(.975)}
.ip.ok{background:#fff;color:#0f0f0f;border-color:#fff}
.btn{background:#32323266;border:1px solid var(--ac);border-radius:50px;color:var(--hi);cursor:pointer;font:inherit;font-size:.78rem;font-weight:600;letter-spacing:1px;padding:0 18px;height:42px;text-transform:uppercase;transition:background .25s,border-color .25s}
.btn:hover{background:#464646b3;border-color:#888}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
.mo{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:#000000d9;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mo.show{display:flex;animation:fi .25s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.md{position:relative;width:100%;max-width:460px;max-height:85%;overflow:auto;background:#1a1a1a;color:#ddd;border:1px solid #ffffff1a;border-radius:18px;padding:30px 26px 26px;box-shadow:0 20px 60px #00000080;animation:dr .3s}
@keyframes dr{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:none}}
.md h2{color:#fff;font-size:1.4rem;font-weight:700;margin-bottom:12px}
.md p{margin:12px 0;color:#bbb}
.md .ver{color:#aaa;border-color:#ffffff24}
.md .tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.md .tag{background:#2a2a2a;border:1px solid #ffffff1a;border-radius:999px;color:#aaa;font-size:.75rem;font-weight:600;padding:4px 14px}
.md .socials{display:flex;gap:12px;margin:18px 0 6px}
.md .social{width:44px;height:44px;border-radius:50%;background:#2a2a2a;border:1px solid #ffffff1a;display:flex;align-items:center;justify-content:center;color:#ccc;text-decoration:none;transition:background .2s,color .2s,transform .2s}
.md .social:hover{background:#3a3a3a;color:#fff;transform:scale(1.08)}
.x{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:#333;color:#fff;font-size:20px;cursor:pointer;transition:background .2s}
.x:hover{background:#555}
.cr{text-align:center;color:var(--mu);font-size:.8rem;margin-top:30px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
  <div class="head">
    <h1>Мониторинг <span class="acc">DEVBLOGS</span></h1>
    <p class="sub"><span class="live"></span>Онлайн обновляется автоматически</p>
  </div>
  <div class="tot">
    <div class="st"><b id="tOn">0</b><span>игроков онлайн</span></div>
    <div class="st"><b id="tSrv">0</b><span>проектов</span></div>
  </div>
  <div class="fl" id="fl"></div>
  <div class="grid" id="list"></div>
  <p class="cr">by hori</p>
</div>
<div class="mo" id="mo"><div class="md" id="md"></div></div>

<script>
// ===== servers.txt =====
// НАЗВАНИЕ|ССЫЛКА НА САЙТ|ТЕГИ|РЕПУТАЦИЯ|API|ОПИСАНИЕ|СОЦСЕТИ|МАКС_ОНЛАЙН|ИКОНКА|DEVBLOG|ЦВЕТ
// ИКОНКА — ссылка на картинку или путь (icons/magix.png); если пусто/не грузится — буква.
// DEVBLOG — номер выпуска (например 12); если пусто — плашка не показывается.
// ЦВЕТ — цвет свечения иконки: #RRGGBB или RRGGBB; если пусто — берётся из палитры.
// В поле API можно указать несколько URL через ';' — они будут сложены.
// К URL можно добавить фильтр по имени сервера: /api/magix?name=MAGIX
var SERVERS = [];
var REFRESH_MS = 15000;
var PALETTE = ['4ade80','60a5fa','fbbf24','f472b6','a78bfa','34d399','f97316','06b6d4','ec4899','8b5cf6'];

function parseServers(text) {
  var res = [];
  text.split('\n').map(function(l){return l.trim()}).filter(function(l){return l && l[0] !== '#'}).forEach(function(line) {
    var p = line.split('|').map(function(x){return x.trim()});
    if (p.length < 5 || !p[0]) return;
    var socials = [];
    (p[6] || '').split(',').forEach(function(s) {
      var kv = s.trim().split(':');
      if (kv.length >= 2 && kv[0]) socials.push({type: kv[0].trim().toLowerCase(), url: kv.slice(1).join(':').trim()});
    });
    var color = (p[10] || '').trim();
    if (color && !/^#/.test(color)) color = '#' + color;
    if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)) color = '';
    res.push({
      name: p[0],
      site: p[1],
      tags: p[2] ? p[2].split(',').map(function(t){return t.trim()}).filter(Boolean) : [],
      rep: p[3],
      api: p[4],
      desc: p[5] || '',
      socials: socials,
      max: parseInt(p[7], 10) || 0,
      icon: p[8] || '',
      dev: (p[9] || '').replace(/^#/, ''),
      online: null,
      error: false,
      c: color || '#' + PALETTE[res.length % PALETTE.length]
    });
  });
  return res;
}

// ===== API: онлайн =====
// Поддерживает:
//   ShockProject:   {success, response:{servers:[{playing, online:bool}]}}
//   MYRUST:         {total_players, servers:[{online, players}]}
//   BUMMER RUST:    [{runtime:{players, maxPlayers}}]
//   YRS:            {status, response:{Players, MaxPlayers}} (один сервер)
//   HIRUST:         {success, data:{servers:[{players, maxPlayers}]}}
//   Gamestores.app: {result, data:{total:{players, playersMax}, servers:[{players, playersMax}]}}
//   Общий случай:   players / playing / online / runtime / response / playersMax / maxPlayers
function findList(data) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === 'object') {
    var keys = ['servers', 'data', 'result', 'items', 'list'];
    for (var i = 0; i < keys.length; i++) {
      if (Array.isArray(data[keys[i]])) return data[keys[i]];
    }
    for (var k in data) {
      if (data[k] && typeof data[k] === 'object') {
        var found = findList(data[k]);
        if (found.length) return found;
      }
    }
  }
  return [];
}

// Онлайн одного сервера. Приоритет:
//   1) response.Players (YRS)
//   2) runtime.players (BUMMER)
//   3) online — число (MYRUST)
//   4) playing — число (ShockProject)
//   5) players — число или {playing|online} (HIRUST, Gamestores, общий)
function playingOf(s) {
  if (!s || typeof s !== 'object') return 0;

  if (s.response && typeof s.response === 'object' && s.response.Players !== undefined) {
    return parseInt(s.response.Players, 10) || 0;
  }
  if (s.runtime && typeof s.runtime === 'object' && s.runtime.players !== undefined) {
    return parseInt(s.runtime.players, 10) || 0;
  }

  var v = s.online;
  if (typeof v === 'boolean') v = undefined;

  if (v === undefined) {
    v = s.playing;
    if (typeof v === 'boolean') v = undefined;
  }
  if (v === undefined) {
    v = s.players;
    if (v && typeof v === 'object') {
      v = v.playing !== undefined ? v.playing : v.online;
    }
  }

  return parseInt(v, 10) || 0;
}

// Максимум сервера, если API его отдаёт.
function maxOf(s) {
  if (!s || typeof s !== 'object') return 0;
  if (s.response && typeof s.response === 'object' && s.response.MaxPlayers !== undefined) {
    return parseInt(s.response.MaxPlayers, 10) || 0;
  }
  if (s.runtime && typeof s.runtime === 'object' && s.runtime.maxPlayers !== undefined) {
    return parseInt(s.runtime.maxPlayers, 10) || 0;
  }
  if (s.playersMax !== undefined) return parseInt(s.playersMax, 10) || 0;  // Gamestores
  if (s.maxPlayers !== undefined) return parseInt(s.maxPlayers, 10) || 0;   // HIRUST
  var v = s.max_players !== undefined ? s.max_players : s.max;
  return parseInt(v, 10) || 0;
}

// Сумма онлайна + максимум по ОДНОМУ ответу.
// filter — подстрока имени сервера (регистр не важен). Если задан,
// data.total игнорируется и берутся только подходящие серверы.
function sumOnline(data, filter) {
  var list = findList(data);
  filter = filter || '';

  if (filter && list.length) {
    list = list.filter(function(s) {
      var nm = (s && s.name ? String(s.name) : '').toLowerCase();
      return nm.indexOf(filter) !== -1;
    });
  }

  var sum = 0, max = 0;
  list.forEach(function(s) {
    sum += playingOf(s);
    max += maxOf(s);
  });

  // Одиночный объект (YRS) — не массив, без фильтра
  if (!list.length && !filter && data && typeof data === 'object') {
    var one = data.response && typeof data.response === 'object' ? data.response : data;
    sum = playingOf(one);
    max = maxOf(one);
  }

  // MYRUST — только если не фильтруем
  if (!filter && data && typeof data.total_players === 'number') sum = data.total_players;

  // Gamestores: data.total — только если не фильтруем
  if (!filter && data && data.data && data.data.total && typeof data.data.total.players === 'number') {
    sum = data.data.total.players;
    max = parseInt(data.data.total.playersMax, 10) || max;
  }

  return { online: sum, max: max };
}

// Загружаем ОДИН URL.
function fetchOne(url) {
  return fetch(url, {cache: 'no-store'})
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

// Загружаем сервер. В srv.api может быть несколько URL через ';'.
// У каждого URL можно указать фильтр по имени сервера: /api/magix?name=MAGIX
function loadOnline(srv) {
  var parts = String(srv.api).split(';').map(function(u) { return u.trim(); }).filter(Boolean);
  return Promise.all(parts.map(function(part) {
    var qIdx = part.indexOf('?');
    var url = part, filter = '';
    if (qIdx !== -1) {
      url = part.slice(0, qIdx);
      var qs = part.slice(qIdx + 1);
      var m = /(?:^|&)name=([^&]*)/.exec(qs);
      if (m) filter = decodeURIComponent(m[1]).toLowerCase();
    }
    return fetchOne(url)
      .then(function(d) { return sumOnline(d, filter); })
      .catch(function(err) { console.warn('API error:', srv.name, url, err); return null; });
  })).then(function(results) {
    var ok = results.filter(function(x) { return x !== null; });
    if (!ok.length) { srv.error = true; return; }

    var online = 0, max = 0;
    ok.forEach(function(x) { online += x.online; max += x.max; });

    srv.online = online;
    if (max && (!srv.max || srv.max < max)) srv.max = max;
    srv.error = false;
  });
}

function refreshAll() {
  return Promise.all(SERVERS.map(loadOnline)).then(render);
}

// ===== UI =====
var SOCIAL_ICONS = {

  vk: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13.162 18.994c.609 0 .858-.406.851-.915-.031-1.917.714-2.949 2.059-1.604 1.488 1.488 1.796 2.519 3.603 2.519h3.2c.808 0 1.126-.26 1.126-.668 0-.863-1.421-2.386-2.625-3.504-1.686-1.565-1.765-1.602-.313-3.486 1.801-2.339 4.157-5.336 2.073-5.336h-3.981c-.772 0-.828.435-1.103 1.083-.995 2.347-2.886 5.387-3.604 4.922-.751-.485-.407-2.406-.35-5.261.015-.754.011-1.271-1.141-1.539-.629-.145-1.241-.205-1.809-.205-2.273 0-3.841.953-2.95 1.119 1.571.293 1.42 3.692 1.054 5.16-.638 2.556-3.036-2.024-4.035-4.305-.241-.548-.315-.974-1.175-.974H.439C-.049 5.73-.176 6.068.146 6.59c.902 1.457 1.715 2.943 3.207 5.314 1.852 2.942 3.722 3.345 4.342 3.345.477 0 .744-.248.744-.889v-2.315c0-1.285.442-1.482 1.116-1.001 1.271.908 2.428 2.635 3.34 3.805.602.771 1.239.602 1.239.602z"/></svg>',

};
function socialIcon(t) { return SOCIAL_ICONS[t] || SOCIAL_ICONS.site; }

var $ = function(i){return document.getElementById(i)}, F = "all";

function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#'; }
function iconHtml(s) {
  var letter = '<b>' + esc((s.name || '?').charAt(0)) + '</b>';
  if (!s.icon || !/^(https?:\/\/|[\w.\/-]+$)/i.test(s.icon)) return letter;
  return '<img src="' + esc(s.icon) + '" alt="" loading="lazy" data-l="' + esc((s.name || '?').charAt(0)) + '">';
}
function host(u) { return u.replace(/^https?:\/\//i, '').replace(/\/$/, ''); }
function allTags() {
  var o = {};
  SERVERS.forEach(function(s) { s.tags.forEach(function(t) { o[t] = 1; }); });
  return Object.keys(o).sort();
}
function pills() {
  $("fl").innerHTML = ["all"].concat(allTags()).map(function(v) {
    return '<button class="pill' + (v === F ? ' on' : '') + '" data-v="' + esc(v) + '">' + (v === "all" ? "Все" : esc(v)) + '</button>';
  }).join("");
}
function render() {
  var items = SERVERS.filter(function(s) {
    return F === "all" || s.tags.indexOf(F) !== -1;
  }).sort(function(a, b) { return (b.online || 0) - (a.online || 0); });

  var all = 0;
  items.forEach(function(s) { all += s.online || 0; });
  $("tOn").textContent = all.toLocaleString("ru");
  $("tSrv").textContent = items.length;

  $("list").innerHTML = items.length ? items.map(function(s) {
    var n = s.online || 0;
    var onlineTxt = s.online === null ? (s.error ? '<span class="err">нет данных</span>' : '…') : n.toLocaleString("ru");
    var bar = '', pct = '';
    if (s.max && s.online !== null) {
      var p = Math.min(100, Math.round(n / s.max * 100));
      bar = '<div class="bar' + (p >= 100 ? ' full' : '') + '"><span style="width:' + p + '%"></span></div>';
      pct = '<small>' + p + '%</small>';
    }
    var tags = s.tags.length ? '<div class="vers">' + s.tags.map(function(t) { return '<span class="ver">' + esc(t) + '</span>'; }).join("") + '</div>' : '';
    var rep = s.rep ? '<span class="rep" title="Репутация">★ ' + esc(s.rep) + '</span>' : '';
    var dev = s.dev ? '<span class="dev" title="Номер девблога">DEVBLOG #' + esc(s.dev) + '</span>' : '';
    var bgs = (rep || dev) ? '<div class="bgs">' + rep + dev + '</div>' : '';
    return '<div class="card" style="--c:' + s.c + '"><div class="top"><div class="dot">' + iconHtml(s) + '</div><div class="nm">' + esc(s.name) + '</div>' + bgs + '</div>' +
      tags + bar +
      '<div class="foot"><span><b>' + onlineTxt + '</b> <small>' + (s.max ? '/ ' + s.max + ' ' : '') + 'онлайн</small></span>' + pct + '</div>' +
      '<div class="act"><button class="ip" data-s="' + esc(s.site) + '" title="Скопировать ссылку"><span>' + esc(host(s.site)) + '</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>' +
      '<button class="btn" data-i="' + SERVERS.indexOf(s) + '">Описание</button></div></div>';
  }).join("") : '<div class="empty">Нет проектов с таким тегом</div>';
}
function openM(i) {
  var s = SERVERS[i];
  var tagsHtml = s.tags.length ? '<div class="tags">' + s.tags.map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>' : '';
  var socs = s.socials.slice();
  if (/^https?:\/\//i.test(s.site)) socs.push({type: 'site', url: s.site});
  var socialsHtml = socs.length ? '<div class="socials">' + socs.map(function(x) {
    return '<a class="social" href="' + esc(safeUrl(x.url)) + '" target="_blank" rel="noopener noreferrer" title="' + esc(x.type) + '">' + socialIcon(x.type) + '</a>';
  }).join("") + '</div>' : '';
  $("md").innerHTML = '<button class="x" data-c="1" aria-label="Закрыть">×</button>' +
    '<h2>' + esc(s.name) + '</h2>' +
    ((s.rep || s.dev) ? '<div class="vers">' + (s.rep ? '<span class="ver">Репутация: ' + esc(s.rep) + '</span>' : '') + (s.dev ? '<span class="dev">DEVBLOG #' + esc(s.dev) + '</span>' : '') + '</div>' : '') +
    (s.desc ? '<p>' + esc(s.desc) + '</p>' : '') + tagsHtml + socialsHtml;
  $("mo").classList.add("show");
}
function copy(b) {
  var t = b.dataset.s, label = b.firstChild.textContent;
  var done = function() {
    b.classList.add("ok");
    b.firstChild.textContent = "Скопировано";
    setTimeout(function() { b.classList.remove("ok"); b.firstChild.textContent = label; }, 1400);
  };
  try { navigator.clipboard.writeText(t).then(done, done); } catch (e) { done(); }
}
document.addEventListener("click", function(e) {
  var t = e.target.closest("button") || e.target;
  if (t.classList.contains("pill")) { F = t.dataset.v; pills(); render(); }
  else if (t.classList.contains("btn")) openM(t.dataset.i);
  else if (t.classList.contains("ip")) copy(t);
  else if (t.dataset.c || e.target === $("mo")) $("mo").classList.remove("show");
});
document.addEventListener("error", function(e) {
  var im = e.target;
  if (im && im.tagName === "IMG" && im.dataset.l && im.parentNode) {
    im.parentNode.innerHTML = '<b>' + esc(im.dataset.l) + '</b>';
  }
}, true);
document.addEventListener("keydown", function(e) { if (e.key === "Escape") $("mo").classList.remove("show"); });

// ===== старт =====
fetch("servers.txt", {cache: 'no-store'})
  .then(function(r) { if (!r.ok) throw new Error("Файл servers.txt не найден"); return r.text(); })
  .then(function(text) {
    SERVERS = parseServers(text);
    if (!SERVERS.length) throw new Error("servers.txt пуст или имеет неверный формат");
    pills();
    render();
    refreshAll();
    setInterval(refreshAll, REFRESH_MS);
  })
  .catch(function(err) {
    $("list").innerHTML = '<div class="empty">Ошибка загрузки данных: ' + esc(err.message) + '</div>';
  });
</script>
